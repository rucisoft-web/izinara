# Lingkungan percobaan: PostgreSQL 16 dan Odoo 18 Community dengan add-on Izinara.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on: [db]
    command: ["odoo", "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/izinara"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - ./:/mnt/izinara
      - odoo-data:/var/lib/odoo

volumes:
  pgdata:
  odoo-data:
